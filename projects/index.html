      const encryptedDataBuf = new Uint8Array(ciphertextBuf.length + authTagBuf.length);
      encryptedDataBuf.set(ciphertextBuf, 0);
      encryptedDataBuf.set(authTagBuf, ciphertextBuf.length);

      // Import password as PBKDF2 base key
      const pwEncoder = new TextEncoder();
      const pwKey = await window.crypto.subtle.importKey(
        "raw",
        pwEncoder.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      // Derive AES-GCM 256-bit key from password
      const derivedKey = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBuf,
          iterations: data.iterations,
          hash: "SHA-256"
        },
        pwKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      // Decrypt using Web Crypto API
      const decryptedBuf = await window.crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: ivBuf
        },
        derivedKey,
        encryptedDataBuf
      );

      return new TextDecoder().decode(decryptedBuf);
    }

    function renderDecryptedData(data) {
      // 1. Render projects list
      const projectsDiv = document.createElement('div');
      projectsDiv.className = 'yaml';
      
      let html = '<p class="yc"># devsecops_reference.yaml</p>';
      html += '<div class="yrow"><span class="k">owner:</span> Srinivas Sarkar</div>';
      html += '<div class="yrow"><span class="k">status:</span> decrypted</div>';
      html += '<div class="yrow"><span class="k">projects:</span></div>';
      
      data.projects.forEach(p => {
        html += '<div class="ylist">';
        html += '<span class="dash">-</span>';
        html += `<span><span class="k">title:</span> ${p.title}</span>`;
        html += '</div>';
        html += '<div class="ylist" style="padding-left: 24px;">';
        html += `<span><span class="k">ref:</span> <a href="${p.url}" target="_blank" rel="noopener">Notion Document ↗</a></span>`;
        html += '</div>';
      });
      
      projectsDiv.innerHTML = html;
      termOut.appendChild(projectsDiv);

      // 2. Render interview script
      const scriptDiv = document.createElement('div');
      scriptDiv.className = 'yaml';
      scriptDiv.style.marginTop = '24px';
      
      let scriptHtml = '<p class="yc"># interview_script.md</p>';
      scriptHtml += `<h3 style="color: var(--green); margin-bottom: 14px;">${data.script.title}</h3>`;
      
      data.script.sections.forEach(sec => {
        scriptHtml += '<hr>';
        scriptHtml += `<h3>${sec.heading}</h3>`;
        
        // Split paragraphs and format blockquotes
        const paragraphs = sec.text.split('\n\n');
        paragraphs.forEach(p => {
          if (p.startsWith('\"') || p.startsWith('>"') || p.startsWith('> "')) {
            // Remove blockquote prefix if present
            const cleanP = p.replace(/^>\s*\"?/, '').replace(/\"$/, '');
            scriptHtml += `<blockquote>"${cleanP.replace(/\n/g, '<br>')}"</blockquote>`;
          } else {
            scriptHtml += `<p>${p.replace(/\n/g, '<br>')}</p>`;
          }
        });
      });
      
      scriptDiv.innerHTML = scriptHtml;
      termOut.appendChild(scriptDiv);
    }
  </script>
