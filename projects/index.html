<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>randomtechy@SrinivasSarkar:~/projects$ — Projects Vault</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2306090e'/%3E%3Ctext x='1.5' y='12.5' font-family='monospace' font-size='12' fill='%2300e67a'%3E%3E%3C/text%3E%3C/svg%3E">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #06090e;
      --surface: #0b1017;
      --border: #1a2331;
      --border-strong: #2c3a4d;
      --text: #e3e9f0;
      --text-2: #94a2b5;
      --text-3: #5b6a7f;
      --green: #00e67a;
      --green-dim: rgba(0, 230, 122, 0.08);
      --cyan: #7cc7e8;
      --red: #ff6b6b;
      --font: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --max-w: 780px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.7;
      padding: 60px 24px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: var(--max-w);
      margin: 0 auto;
    }

    .header {
      margin-bottom: 30px;
    }

    .logo {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.2px;
    }

    .logo .u { color: var(--green); }
    .logo .p { color: var(--text-3); }

    .term {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      padding: 22px;
      margin-bottom: 24px;
      cursor: text;
    }

    .term-out {
      font-size: 0.84rem;
      line-height: 1.65;
    }

    .tr { margin-bottom: 8px; }
    .tr .tp { color: var(--green); }

    .to {
      color: var(--text-2);
      margin-top: 4px;
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    .to.err { color: var(--red); }

    .term-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    .term-line .tp { color: var(--green); flex-shrink: 0; font-size: 0.84rem; }

    .term-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.84rem;
      caret-color: var(--green);
    }

    /* YAML rendering */
    .yaml {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 18px;
      margin-top: 14px;
      font-size: 0.84rem;
      line-height: 1.8;
      overflow-x: auto;
    }

    .yc { color: var(--text-3); }

    .yrow { white-space: pre-wrap; }
    .yrow .k { color: var(--cyan); }
    .ystr { color: var(--green); }

    .ylist {
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: var(--text-2);
      padding-left: 16px;
    }

    .ylist .dash { color: var(--green); }

    .yaml a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--border-strong);
      transition: all 0.2s;
    }

    .yaml a:hover { color: var(--green); border-color: var(--green); }

    .btn {
      display: inline-block;
      font-size: 0.82rem;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 9px 16px;
      transition: all 0.2s var(--ease);
      margin-top: 10px;
    }

    .btn:hover {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-dim);
    }

    code {
      font-family: var(--font);
      color: var(--green);
      background: var(--green-dim);
      border: 1px solid rgba(0, 230, 122, 0.15);
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 0.86em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <a href="../" class="logo"><span class="u">randomtechy@</span>SrinivasSarkar<span class="p">:~/projects$</span></a>
    </div>
    
    <div class="term" id="term">
      <div class="term-out" id="termOut">
        <div class="tr"><span class="tp">randomtechy@SrinivasSarkar:~/projects$</span> ./unlock</div>
      </div>
      
      <div class="term-line" id="inputLine">
        <span class="tp">Enter passphrase:</span>
        <input class="term-input" id="pwdInput" type="password" autocomplete="off" spellcheck="false" autofocus>
      </div>
    </div>
    
    <a href="../" class="btn">[ cd .. ]</a>
  </div>
  
  <script>
    // Hex to Uint8Array helper
    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < bytes.length; i++) {
        bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
      }
      return bytes;
    }

    // Encrypted payload generated from Node.js (AES-256-GCM)
    const payloadData = {
      salt: "f65804394847c63a8e4ebcca33efabb1",
      iv: "0824e885b4e581bb0e844f13",
      ciphertext: "1d8d8a284a04c7f90aec6499709b6b03d3b36bd3b652379d7471f64e30c13dfa155d3c10eb01d2a79e279137a78223813630371a187298b5b872cde826e944656f64f9aa1b9c1409892a7a497f71221a1c3aaeefc27bf79a5b2ace5ff374edcd0600774b42b0d33004e6c08c978b7d090ea81f0ab49b304457514a5ac257b4cd2b37a0cf181a15107bcd2226c39f4327583dce07a25b01881f23d01b2cc29b9673fb97d24747013189ea4370802d79ae96d1feecd559003bb92353f31e45a4263c90d84190ca3e0d16ca2d2f181ae7f904eb7456881ffa86d9aa00b0e7acb54aede334c87798d48d0d3ee2231d9010315bb8d8eab564d51b22d50e233e1739f74fad595cb23f7e86db816c3999b790b38dddeeb2ac92c4f406a0ad1e448d5f29dd44558ee94ce69685c0f88acfe199761661ca3b5c09832c5c2f12fa1235c90e34cfa8e5d138bb192b9a78e41361b587c7e4aecdee104769fcf520d09950accb0e99e647482cc0ee336244529a96a5aca1906b72acc6c70506ad115d55013e101b2e2f859f294eae882a0291b84109f7c3609197",
      authTag: "5c88f5840c2efea824112ee534b910db",
      iterations: 100000
    };

    const term = document.getElementById('term');
    const termOut = document.getElementById('termOut');
    const pwdInput = document.getElementById('pwdInput');
    const inputLine = document.getElementById('inputLine');

    pwdInput.addEventListener('keydown', async function (e) {
      if (e.key === 'Enter') {
        const password = pwdInput.value.trim();
        pwdInput.value = '';
        if (!password) return;

        inputLine.style.display = 'none';

        // Add visual indicator that key is being processed
        const statusDiv = document.createElement('div');
        statusDiv.className = 'to';
        statusDiv.textContent = 'Decrypting secure vault...';
        termOut.appendChild(statusDiv);

        try {
          const decryptedText = await decryptPayload(password, payloadData);
          statusDiv.remove(); // Remove decrypting status
          
          const successDiv = document.createElement('div');
          successDiv.className = 'to';
          successDiv.innerHTML = 'Vault unlocked successfully.<br>';
          termOut.appendChild(successDiv);
          
          renderProjects(JSON.parse(decryptedText));
        } catch (err) {
          statusDiv.remove(); // Remove decrypting status
          const errDiv = document.createElement('div');
          errDiv.className = 'to err';
          errDiv.textContent = './unlock: decryption failed. Permission denied (invalid passphrase).';
          termOut.appendChild(errDiv);
          
          // Show input line again after a short delay to retry
          setTimeout(() => {
            inputLine.style.display = 'flex';
            pwdInput.focus();
          }, 800);
        }
      }
    });

    // Handle clicks anywhere on terminal container to focus input
    term.addEventListener('click', () => {
      pwdInput.focus();
    });

    async function decryptPayload(password, data) {
      const saltBuf = hexToBytes(data.salt);
      const ivBuf = hexToBytes(data.iv);
      const ciphertextBuf = hexToBytes(data.ciphertext);
      const authTagBuf = hexToBytes(data.authTag);
      
      // Combine ciphertext and authTag for Web Crypto API
      const encryptedDataBuf = new Uint8Array(ciphertextBuf.length + authTagBuf.length);
      encryptedDataBuf.set(ciphertextBuf, 0);
      encryptedDataBuf.set(authTagBuf, ciphertextBuf.length);

      // Import password as PBKDF2 base key
      const pwEncoder = new TextEncoder();
      const pwKey = await window.crypto.subtle.importKey(
        "raw",
        pwEncoder.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      // Derive AES-GCM 256-bit key from password
      const derivedKey = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBuf,
          iterations: data.iterations,
          hash: "SHA-256"
        },
        pwKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      // Decrypt using Web Crypto API
      const decryptedBuf = await window.crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: ivBuf
        },
        derivedKey,
        encryptedDataBuf
      );

      return new TextDecoder().decode(decryptedBuf);
    }

    function renderProjects(projects) {
      const yamlDiv = document.createElement('div');
      yamlDiv.className = 'yaml';
      
      let html = '<p class="yc"># devsecops_reference.yaml</p>';
      html += '<div class="yrow"><span class="k">owner:</span> Srinivas Sarkar</div>';
      html += '<div class="yrow"><span class="k">status:</span> decrypted</div>';
      html += '<div class="yrow"><span class="k">projects:</span></div>';
      
      projects.forEach(p => {
        html += '<div class="ylist">';
        html += '<span class="dash">-</span>';
        html += `<span><span class="k">title:</span> ${p.title}</span>`;
        html += '</div>';
        html += '<div class="ylist" style="padding-left: 24px;">';
        html += `<span><span class="k">ref:</span> <a href="${p.url}" target="_blank" rel="noopener">Notion Document ↗</a></span>`;
        html += '</div>';
      });
      
      yamlDiv.innerHTML = html;
      termOut.appendChild(yamlDiv);
    }
  </script>
</body>
</html>
