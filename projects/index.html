    const term = document.getElementById('term');

    pwdInput.addEventListener('keydown', async function (e) {
      if (e.key === 'Enter') {
        const password = pwdInput.value.trim();
        pwdInput.value = '';
        if (!password) return;

        inputLine.style.display = 'none';

        // Add visual indicator that key is being processed
        const statusDiv = document.createElement('div');
        statusDiv.className = 'to';
        statusDiv.textContent = 'Decrypting secure vault...';
        termOut.appendChild(statusDiv);

        try {
          const decryptedText = await decryptPayload(password, payloadData);
          statusDiv.remove(); // Remove decrypting status
          
          const successDiv = document.createElement('div');
          successDiv.className = 'to';
          successDiv.innerHTML = 'Vault unlocked successfully.<br>';
          termOut.appendChild(successDiv);
          
          renderDecryptedData(JSON.parse(decryptedText));
        } catch (err) {
          statusDiv.remove(); // Remove decrypting status
          const errDiv = document.createElement('div');
          errDiv.className = 'to err';
          errDiv.textContent = './unlock: decryption failed. Permission denied (invalid passphrase).';
          termOut.appendChild(errDiv);
          
          // Show input line again after a short delay to retry
          setTimeout(() => {
            inputLine.style.display = 'flex';
            pwdInput.focus();
          }, 800);
        }
      }
    });

    // Handle clicks anywhere on terminal container to focus input
    term.addEventListener('click', () => {

    async function decryptPayload(password, data) {
      const saltBuf = hexToBytes(data.salt);
      const ivBuf = hexToBytes(data.iv);
      const ciphertextBuf = hexToBytes(data.ciphertext);
      const authTagBuf = hexToBytes(data.authTag);
      
      // Combine ciphertext and authTag for Web Crypto API
      const encryptedDataBuf = new Uint8Array(ciphertextBuf.length + authTagBuf.length);
      encryptedDataBuf.set(ciphertextBuf, 0);
      encryptedDataBuf.set(authTagBuf, ciphertextBuf.length);

      // Import password as PBKDF2 base key
      const pwEncoder = new TextEncoder();
      const pwKey = await window.crypto.subtle.importKey(
        "raw",
        pwEncoder.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      // Derive AES-GCM 256-bit key from password
      const derivedKey = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBuf,
          iterations: data.iterations,
          hash: "SHA-256"
        },
        pwKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      // Decrypt using Web Crypto API
      const decryptedBuf = await window.crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: ivBuf
        },
        derivedKey,
        encryptedDataBuf
      );

      return new TextDecoder().decode(decryptedBuf);
    }

    function renderDecryptedData(data) {

      data.projects.forEach(p => {

      termOut.appendChild(projectsDiv);

      // 2. Render interview script

      scriptDiv.className = 'yaml';

      let scriptHtml = '<p class="yc"># interview_script.md</p>';
      scriptHtml += `<h3 style="color: var(--green); margin-bottom: 14px;">${data.script.title}</h3>`;
      
      data.script.sections.forEach(sec => {
        scriptHtml += '<hr>';
        scriptHtml += `<h3 style="color: var(--cyan); margin-bottom: 10px;">${sec.heading}</h3>`;
        
        let cleanText = sec.text.trim();
        if (cleanText.startsWith('"') && cleanText.endsWith('"')) {
          cleanText = cleanText.substring(1, cleanText.length - 1);
        }
        
        const paragraphs = cleanText.split('\n\n');
        paragraphs.forEach(p => {
          const lines = p.split('\n');
          let formattedHtml = '';
          lines.forEach(line => {
            const trimmed = line.trim();
            if (/^(\d+\.|-)\s+/.test(trimmed)) {
              const spaceIdx = trimmed.indexOf(' ');
              const marker = trimmed.substring(0, spaceIdx + 1);
              const text = trimmed.substring(spaceIdx + 1);
              formattedHtml += `<div style="padding-left: 18px; margin: 4px 0;"><span style="color: var(--green);">${marker}</span>${text}</div>`;
            } else {
              formattedHtml += (formattedHtml ? '<br>' : '') + line;
            }
          });
          scriptHtml += `<p style="line-height: 1.6; margin-bottom: 12px; color: var(--text);">${formattedHtml}</p>`;
        });
      });
      
      scriptDiv.innerHTML = scriptHtml;
      termOut.appendChild(scriptDiv);

      // 3. Render verified production work experience & RCAs

        const expDiv = document.createElement('div');
        expDiv.className = 'yaml';
        expDiv.style.marginTop = '24px';

        let expHtml = '<p class="yc"># verified_production_experience.yaml</p>';
        expHtml += `<h3 style="color: var(--cyan); margin-bottom: 14px;">${exp.company} — ${exp.role} <span style="font-size:0.85rem; color:var(--text-3);">(${exp.duration})</span></h3>`;

        if (exp.clusters) {
          expHtml += '<div class="yrow" style="color: var(--text-2); margin-bottom: 6px;"><span class="k">prod_cluster:</span> ' + exp.clusters.production_inference + '</div>';
          expHtml += '<div class="yrow" style="color: var(--text-2); margin-bottom: 6px;"><span class="k">stage_cluster:</span> ' + exp.clusters.enterprise_staging + '</div>';

        if (exp.infrastructure_spec && exp.infrastructure_spec.active_daemons) {
          expHtml += '<div class="yrow" style="margin-bottom: 6px;"><span class="k">active_pm2_microservices:</span></div>';
          exp.infrastructure_spec.active_daemons.forEach(d => {
            expHtml += `<div class="ylist"><span class="dash">•</span> <code>[id ${d.id}] ${d.name}</code> (${d.mem}) — ${d.role}</div>`;

        exp.highlights.forEach((h, idx) => {
