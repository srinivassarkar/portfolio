    const term = document.getElementById('term');
    const termOut = document.getElementById('termOut');
    const pwdInput = document.getElementById('pwdInput');
    const inputLine = document.getElementById('inputLine');

    pwdInput.addEventListener('keydown', async function (e) {
      if (e.key === 'Enter') {
        const password = pwdInput.value.trim();
        pwdInput.value = '';
        if (!password) return;

        inputLine.style.display = 'none';

        // Add visual indicator that key is being processed
        const statusDiv = document.createElement('div');
        statusDiv.className = 'to';
        statusDiv.textContent = 'Decrypting secure vault...';
        termOut.appendChild(statusDiv);

        try {
          const decryptedText = await decryptPayload(password, payloadData);
          statusDiv.remove(); // Remove decrypting status
          
          const successDiv = document.createElement('div');
          successDiv.className = 'to';
          successDiv.innerHTML = 'Vault unlocked successfully.<br>';
          termOut.appendChild(successDiv);
          
          renderDecryptedData(JSON.parse(decryptedText));
        } catch (err) {
          statusDiv.remove(); // Remove decrypting status
          const errDiv = document.createElement('div');
          errDiv.className = 'to err';
          errDiv.textContent = './unlock: decryption failed. Permission denied (invalid passphrase).';
          termOut.appendChild(errDiv);
          
          // Show input line again after a short delay to retry
          setTimeout(() => {
            inputLine.style.display = 'flex';
            pwdInput.focus();
          }, 800);
        }
      }
    });

    // Handle clicks anywhere on terminal container to focus input
    term.addEventListener('click', () => {
      pwdInput.focus();
    });

    async function decryptPayload(password, data) {
      const saltBuf = hexToBytes(data.salt);
      const ivBuf = hexToBytes(data.iv);
      const ciphertextBuf = hexToBytes(data.ciphertext);
      const authTagBuf = hexToBytes(data.authTag);
      
      // Combine ciphertext and authTag for Web Crypto API
      const encryptedDataBuf = new Uint8Array(ciphertextBuf.length + authTagBuf.length);
      encryptedDataBuf.set(ciphertextBuf, 0);
      encryptedDataBuf.set(authTagBuf, ciphertextBuf.length);

      // Import password as PBKDF2 base key
      const pwEncoder = new TextEncoder();
      const pwKey = await window.crypto.subtle.importKey(
        "raw",
        pwEncoder.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      // Derive AES-GCM 256-bit key from password
      const derivedKey = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBuf,
          iterations: data.iterations,
          hash: "SHA-256"
        },
        pwKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      // Decrypt using Web Crypto API
      const decryptedBuf = await window.crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: ivBuf
        },
        derivedKey,
        encryptedDataBuf
      );

      return new TextDecoder().decode(decryptedBuf);
    }

    function renderDecryptedData(data) {
      // 1. Render projects list
      const projectsDiv = document.createElement('div');
      projectsDiv.className = 'yaml';
      
      let html = '<p class="yc"># devsecops_reference.yaml</p>';
      html += '<div class="yrow"><span class="k">owner:</span> Srinivas Sarkar</div>';
      html += '<div class="yrow"><span class="k">status:</span> decrypted</div>';
      html += '<div class="yrow"><span class="k">projects:</span></div>';
      
      data.projects.forEach(p => {
        html += '<div class="ylist">';
        html += '<span class="dash">-</span>';
        html += `<span><span class="k">title:</span> ${p.title}</span>`;
        html += '</div>';
        html += '<div class="ylist" style="padding-left: 24px;">';
        html += `<span><span class="k">ref:</span> <a href="${p.url}" target="_blank" rel="noopener">Notion Document ↗</a></span>`;
        html += '</div>';
      });
      
      projectsDiv.innerHTML = html;
      termOut.appendChild(projectsDiv);

      // 2. Render interview script
      const scriptDiv = document.createElement('div');
      scriptDiv.className = 'yaml';
      scriptDiv.style.marginTop = '24px';
      
      let scriptHtml = '<p class="yc"># interview_script.md</p>';
      scriptHtml += `<h3 style="color: var(--green); margin-bottom: 14px;">${data.script.title}</h3>`;
      
      data.script.sections.forEach(sec => {
        scriptHtml += '<hr>';
        scriptHtml += `<h3>${sec.heading}</h3>`;
        
        // Split paragraphs and format blockquotes
        const paragraphs = sec.text.split('\n\n');
        paragraphs.forEach(p => {
          if (p.startsWith('\"') || p.startsWith('>"') || p.startsWith('> "')) {
            // Remove blockquote prefix if present
            const cleanP = p.replace(/^>\s*\"?/, '').replace(/\"$/, '');
            scriptHtml += `<blockquote>"${cleanP.replace(/\n/g, '<br>')}"</blockquote>`;
          } else {
            scriptHtml += `<p>${p.replace(/\n/g, '<br>')}</p>`;
          }
        });
      });
      
      scriptDiv.innerHTML = scriptHtml;
      termOut.appendChild(scriptDiv);

      // 3. Render verified production work experience & RCAs
      if (data.production_experience) {
        const exp = data.production_experience;
        const expDiv = document.createElement('div');
        expDiv.className = 'yaml';
        expDiv.style.marginTop = '24px';

        let expHtml = '<p class="yc"># verified_production_experience.yaml</p>';
        expHtml += `<h3 style="color: var(--cyan); margin-bottom: 14px;">${exp.company} — ${exp.role} <span style="font-size:0.8rem; color:var(--text-3);">(${exp.duration})</span></h3>`;

        if (exp.infrastructure_spec) {
          expHtml += '<div class="yrow" style="color: var(--text-2); margin-bottom: 12px;"><span class="k">hardware_cluster:</span> ' + exp.infrastructure_spec.hardware + '</div>';
          expHtml += '<div class="yrow"><span class="k">pm2_inference_daemons:</span></div>';
          exp.infrastructure_spec.active_daemons.forEach(d => {
            expHtml += `<div class="ylist"><span class="dash">•</span> <code>[pid ${d.id}] ${d.name}</code> (${d.mem}) — ${d.role}</div>`;
          });
          expHtml += '<br>';
        }

        exp.highlights.forEach((h, idx) => {
          expHtml += '<hr>';
          expHtml += `<h3 style="color: var(--green); margin-bottom: 8px;">[${idx + 1}] ${h.title}</h3>`;
          if (h.problem) expHtml += `<div class="yrow"><span class="k">problem:</span> ${h.problem}</div>`;
          if (h.root_cause) expHtml += `<div class="yrow"><span class="k">root_cause:</span> ${h.root_cause}</div>`;
          if (h.action) expHtml += `<div class="yrow"><span class="k">action:</span> ${h.action}</div>`;
          if (h.prevention) expHtml += `<div class="yrow"><span class="k">prevention:</span> ${h.prevention}</div>`;
          if (h.impact) expHtml += `<div class="yrow"><span class="k">impact:</span> ${h.impact}</div>`;
          if (h.tools) {
            expHtml += `<div class="yrow"><span class="k">tools:</span> [${h.tools.join(', ')}]</div>`;
          }
        });

        expDiv.innerHTML = expHtml;
        termOut.appendChild(expDiv);
      }
