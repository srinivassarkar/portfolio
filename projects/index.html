    async function decryptPayload(password, data) {
      const saltBuf = hexToBytes(data.salt);
      const ivBuf = hexToBytes(data.iv);
      const ciphertextBuf = hexToBytes(data.ciphertext);
      const authTagBuf = hexToBytes(data.authTag);
      
      // Combine ciphertext and authTag for Web Crypto API
      const encryptedDataBuf = new Uint8Array(ciphertextBuf.length + authTagBuf.length);
      encryptedDataBuf.set(ciphertextBuf, 0);
      encryptedDataBuf.set(authTagBuf, ciphertextBuf.length);

      // Import password as PBKDF2 base key
      const pwEncoder = new TextEncoder();
      const pwKey = await window.crypto.subtle.importKey(
        "raw",
        pwEncoder.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      // Derive AES-GCM 256-bit key from password
      const derivedKey = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBuf,
          iterations: data.iterations,
          hash: "SHA-256"
        },
        pwKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      // Decrypt using Web Crypto API
      const decryptedBuf = await window.crypto.subtle.decrypt(
        {
          name: "AES-GCM",
          iv: ivBuf
        },
        derivedKey,
        encryptedDataBuf
      );

      return new TextDecoder().decode(decryptedBuf);
    }

        expDiv.style.marginTop = '24px';

        let expHtml = '<p class="yc"># verified_production_experience.yaml</p>';
        expHtml += `<h3 style="color: var(--cyan); margin-bottom: 14px;">${exp.company} — ${exp.role} <span style="font-size:0.8rem; color:var(--text-3);">(${exp.duration})</span></h3>`;

        if (exp.infrastructure_spec) {
          expHtml += '<div class="yrow" style="color: var(--text-2); margin-bottom: 12px;"><span class="k">hardware_cluster:</span> ' + exp.infrastructure_spec.hardware + '</div>';
          expHtml += '<div class="yrow"><span class="k">pm2_inference_daemons:</span></div>';
          exp.infrastructure_spec.active_daemons.forEach(d => {
            expHtml += `<div class="ylist"><span class="dash">•</span> <code>[pid ${d.id}] ${d.name}</code> (${d.mem}) — ${d.role}</div>`;
          });
          expHtml += '<br>';
        }

        exp.highlights.forEach((h, idx) => {
          expHtml += '<hr>';
          expHtml += `<h3 style="color: var(--green); margin-bottom: 8px;">[${idx + 1}] ${h.title}</h3>`;
          if (h.problem) expHtml += `<div class="yrow"><span class="k">problem:</span> ${h.problem}</div>`;
          if (h.root_cause) expHtml += `<div class="yrow"><span class="k">root_cause:</span> ${h.root_cause}</div>`;
          if (h.action) expHtml += `<div class="yrow"><span class="k">action:</span> ${h.action}</div>`;
          if (h.prevention) expHtml += `<div class="yrow"><span class="k">prevention:</span> ${h.prevention}</div>`;
          if (h.impact) expHtml += `<div class="yrow"><span class="k">impact:</span> ${h.impact}</div>`;
          if (h.tools) {
            expHtml += `<div class="yrow"><span class="k">tools:</span> [${h.tools.join(', ')}]</div>`;
          }
        });

        expDiv.innerHTML = expHtml;
        termOut.appendChild(expDiv);
      }
    }
  </script>
</body>
</html>
